---
layout: default
---
<article class="thought-detail site-shell"><h1 class="visually-hidden">{{ page.title | default: 'A little thought' }}</h1><a class="journal-text-link" href="{{ '/all-thoughts/' | relative_url }}"><span aria-hidden="true">←</span> All the little thoughts</a><div class="thought-note"><p class="eyebrow">In the margins</p><div class="thought-note-content">{{ content }}</div><div class="thought-note-footer"><span>{{ page.author | default: site.author.name }}</span><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%b %-d, %Y' }}</time></div></div></article>
