<article class="journal-post">
  <a class="journal-post-image" href="{{ post.url | relative_url }}" tabindex="-1" aria-hidden="true"><span class="writing-image-note">from the notebook <span>✳</span></span><img src="{{ post.image }}" alt="" loading="lazy" width="720" height="480" onload="this.classList.add('is-loaded'); this.previousElementSibling.hidden = true" onerror="this.hidden = true"></a>
  <div class="journal-post-meta"><span>{{ post.categories | join: ' / ' }}</span><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%b %-d, %Y' }}</time></div>
  <h3><a href="{{ post.url | relative_url }}">{{ post.title }} <span aria-hidden="true">↗</span></a></h3>
  <p>{{ post.description }}</p>
</article>
