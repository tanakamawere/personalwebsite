<article class="thought-note"><div class="thought-note-content">{{ post.content }}</div><div class="thought-note-footer"><span>{{ post.author | default: site.author.name }}<br><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%b %-d, %Y' }}</time></span><a href="{{ post.url | relative_url }}" aria-label="Read thought from {{ post.date | date: '%B %-d, %Y' }}">↗</a></div></article>
